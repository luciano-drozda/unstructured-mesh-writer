mesh_type: triangle            # Delaunay-refined triangulation (MeshPy / Triangle)
box_length:  [1.0, 1.0]        # [Lx, Ly]
n_divisions: [10, 10]          # boundary vertices per edge (not cells)

# ── OPTIONAL keys ─────────────────────────────────────────────────
periodic: [true, false]        # OPTIONAL — default [false, false]; [periodic_x, periodic_y]

quality:                       # OPTIONAL — section is optional; defaults shown per sub-key
  min_angle: 20.0              # OPTIONAL — default 20; minimum angle in degrees
  max_area:  0.005             # OPTIONAL — auto-computed if omitted

obstacles:                     # OPTIONAL — default [] (no obstacles)
  - shape: circle              # circle | rectangle
    center: [0.4, 0.5]        # [cx, cy]
    radius: 0.12
    n_segments: 48             # OPTIONAL — default 32; polygon resolution
  - shape: rectangle
    center: [0.7, 0.5]        # [cx, cy]
    half_extents: [0.08, 0.06] # [hx, hy]