mesh_type: tetra               # Delaunay-refined tetrahedralization (MeshPy / TetGen)
box_length:  [1.0, 1.0, 1.0]  # [Lx, Ly, Lz]
n_divisions: [6, 6, 6]        # boundary vertices per edge (not cells)

# ── OPTIONAL keys ─────────────────────────────────────────────────
periodic: [true, true, false]  # OPTIONAL — default [false, false, false]

quality:                       # OPTIONAL — section is optional; defaults shown per sub-key
  max_volume: 0.001            # OPTIONAL — auto-computed if omitted

obstacles:                     # OPTIONAL — default [] (no obstacles)
  - shape: sphere              # sphere | box
    center: [0.3, 0.5, 0.5]   # [cx, cy, cz]
    radius: 0.12
    subdivisions: 2            # OPTIONAL — default 2; icosphere refinement level
  - shape: box                 # axis-aligned box
    center: [0.7, 0.5, 0.5]   # [cx, cy, cz]
    half_extents: [0.08, 0.08, 0.08]  # [hx, hy, hz]